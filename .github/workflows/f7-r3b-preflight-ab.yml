name: NON-AUTHORITATIVE F7-R3B preflight A-B proof
on:
  push:
    branches: [diagnostic-f7-r3b-preflight-ab-20261007]
permissions:
  contents: read
jobs:
  diagnostic:
    name: DIAGNOSTIC ONLY - ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [A, B1, B2, B3]
    steps:
      - name: Check out frozen V2 witness for sequence equivalence only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-workflows
          ref: 11b5d70a324977be5bb5f1019d90949c05039dd3
          path: witness
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact protected policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: c047a203fc7e1e3326e044f128a7323dea60041b
          path: protected
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact frozen PR22 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: a93b8293491e5502d420f2b99b4b7222c815f7ad
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Isolated preflight experiment - not certification
        shell: pwsh
        env:
          CASE: ${{ matrix.case }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = @'
          import hashlib,importlib.util,json,os,subprocess,sys
          from pathlib import Path
          case=os.environ["CASE"]
          env=dict(os.environ)
          consistent=case in ("B1","B3")
          if consistent:
              env.update(GIT_CONFIG_COUNT="2",GIT_CONFIG_KEY_0="core.autocrlf",
                         GIT_CONFIG_VALUE_0="false",GIT_CONFIG_KEY_1="core.eol",GIT_CONFIG_VALUE_1="lf")
              os.environ.update({k:v for k,v in env.items() if k.startswith("GIT_CONFIG_")})
          def git(root,*args):
              return subprocess.check_output(["git","-C",str(root),*args],env=env)
          for name in ("witness","protected","candidate"):
              args=["git","-C",name,"-c","core.autocrlf=false","-c","core.eol=lf","checkout-index"]
              if case in ("B2","B3"): args.append("--index")
              subprocess.run(args+["--all","--force"],env=env,check=True)
          record={"case":case,"authority":"NONE; DIAGNOSTIC ONLY","repositories":{}}
          expected={"protected":("c047a203fc7e1e3326e044f128a7323dea60041b","c49bebd5d6106da224da733d30b4c2d97c430bfc"),
                    "candidate":("a93b8293491e5502d420f2b99b4b7222c815f7ad","ce45c73908adc77cbaa2151cf2b724ded6ff87bc")}
          for name,(head,tree) in expected.items():
              root=Path(name).resolve(strict=True)
              assert git(root,"rev-parse","HEAD").decode().strip()==head
              assert git(root,"rev-parse","HEAD^{tree}").decode().strip()==tree
              status=git(root,"status","--porcelain=v2","--untracked-files=all").decode()
              equality=[]
              for entry in git(root,"ls-tree","-rz","HEAD").split(b"\0"):
                  if not entry: continue
                  meta,path=entry.split(b"\t",1); mode,kind,oid=meta.split()
                  namepath=path.decode()
                  raw=(root/namepath).read_bytes()
                  index=git(root,"rev-parse",":"+namepath).decode().strip()
                  rawoid=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
                  equality.append({"path":namepath,"head":oid.decode(),"index":index,"raw_worktree":rawoid,
                                   "equal":oid.decode()==index==rawoid})
              record["repositories"][name]={"head":head,"tree":tree,"status":status or "<EMPTY>","equality":equality}
          spec=importlib.util.spec_from_file_location("frozen_witness",Path("witness/maintenance/witness.py").resolve())
          w=importlib.util.module_from_spec(spec);spec.loader.exec_module(w)
          try:
              w.validate_source(Path("witness").resolve(),w.SOURCE+"/"+w.WORKFLOW+"@refs/heads/"+w.SOURCE_BRANCH,
                                "11b5d70a324977be5bb5f1019d90949c05039dd3")
              record["witness_result"]=w.verify(Path("protected").resolve(),Path("candidate").resolve(),
                                               expected["candidate"][0],expected["candidate"][1])
              record["witness_exit"]=0
          except (w.Rejected,subprocess.CalledProcessError) as exc:
              record["witness_result"]=str(exc);record["witness_exit"]=1
          print("AB_RESULT="+json.dumps(record,sort_keys=True))
          assert all(row["equal"] for repo in record["repositories"].values() for row in repo["equality"])
          '@
          $path = Join-Path $env:RUNNER_TEMP 'preflight-ab.py'
          [System.IO.File]::WriteAllText($path, $source, [System.Text.UTF8Encoding]::new($false))
          python -I -S $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
