name: security-policy-maintenance

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  independent-maintenance:
    name: independent-security-policy-maintenance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out independent witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          repository: KiloAlpha021/security-workflows
          ref: ${{ github.workflow_sha }}
          path: witness
          persist-credentials: false
          fetch-depth: 0
      - name: Check out frozen protected policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: 3f78e8a8b877044f73cb2b38bd81a36771fe55cd
          path: protected
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact sealed policy correction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: e095e4b13d780f64a78553aca29744fb0c53626c
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Restore committed representations and verify independent bindings
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WITNESS_SHA: ${{ github.workflow_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HEAD_SHA -notmatch '^[0-9a-f]{40}$' -or $env:WITNESS_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Missing immutable event identity' }
          git -C witness -c core.autocrlf=false -c core.eol=lf checkout-index --index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C protected -c core.autocrlf=false -c core.eol=lf checkout-index --index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C candidate -c core.autocrlf=false -c core.eol=lf checkout-index --index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -S -B witness/maintenance/witness.py protected candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install independently pinned policy environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv policy-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r protected/requirements-policy.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independent adversarial witness tests
        shell: pwsh
        env:
          WITNESS_POLICY_REPO: ${{ github.workspace }}/candidate
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -I -B witness/maintenance/test_witness.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full admitted policy compatibility and adversarial suite
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -I -B witness/maintenance/test_witness.py run-policy candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -I -S -B witness/maintenance/witness.py protected candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -I -B -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('candidate').glob('*.py')]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit independently pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv audit-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r protected/requirements-audit.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip_audit --no-deps -r protected/requirements-policy.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
