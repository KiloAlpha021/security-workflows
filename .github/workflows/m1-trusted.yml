name: trusted-m1-evaluator

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trusted-m1-evaluator:
    name: trusted-m1-evaluator
    runs-on: windows-latest
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check out trusted controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KiloAlpha021/security-workflows
          ref: main
          path: _trusted
      - name: Enforce immutable M1 control identities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content _trusted/trusted-git-blobs.txt | ForEach-Object {
            if ($_ -notmatch '^([0-9a-f]{40})  (.+)$') { throw "Malformed trusted identity: $_" }
            $expected = $Matches[1]
            $path = $Matches[2]
            $actual = (git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw "Trusted M1 control mismatch: $path" }
          }
          $lockExpected = (git --git-dir=_trusted/.git rev-parse 'HEAD:requirements-dev.lock').Trim()
          $lockActual = (git rev-parse 'HEAD:requirements-dev.lock').Trim()
          if ($lockActual -ne $lockExpected) { throw 'Candidate dependency lock differs from trusted lock' }
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install exact trusted dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version"
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --require-hashes -r _trusted/requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Verify dependency and project identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip check
          python -c "import automated_trading_bot"
          python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); assert p['project']['requires-python']=='==3.12.10'; assert p['project']['dependencies']==[]"
      - name: Run independent M1 quality and acceptance gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m ruff check src tests scripts
          python -m mypy src/automated_trading_bot
          python -m coverage run --source=automated_trading_bot -m pytest -q
          python -m coverage report --show-missing
          python -m coverage xml -o coverage.xml
      - name: Run explicit M1 security and provenance controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q tests/test_architecture.py tests/test_blocked_assessment.py tests/test_closure_security.py tests/test_closure_traceability.py tests/test_dependency_lock.py tests/test_engineering_foundation.py tests/test_m1_completion.py tests/test_replay.py tests/test_stage0b_phase39.py
          python -m pip_audit --local
