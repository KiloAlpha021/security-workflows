name: trusted-m1-evaluator

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  trusted-m1-evaluator:
    name: trusted-m1-evaluator
    runs-on: windows-latest
    steps:
      - name: Check out exact trading candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KiloAlpha021/automated-trading-bot
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
      - name: Check out protected trusted controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KiloAlpha021/security-workflows
          ref: main
          path: trusted
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Enforce separate candidate and trusted identities
        shell: pwsh
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          python trusted/verify_candidate.py --candidate candidate --trusted trusted --event-repository $env:EVENT_REPOSITORY --candidate-sha $env:CANDIDATE_SHA --event-name $env:EVENT_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact trusted dependencies
        working-directory: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://pypi.org/simple --require-hashes -r ../trusted/requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Verify dependency and project identity
        working-directory: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import automated_trading_bot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import tomllib,pathlib; p=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); assert p['project']['requires-python']=='==3.12.10'; assert p['project']['dependencies']==[]"
      - name: Run independent M1 quality and acceptance gate
        working-directory: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m ruff check src tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy src/automated_trading_bot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage run --source=automated_trading_bot -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage report --show-missing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage xml -o coverage.xml
      - name: Run explicit M1 security and provenance controls
        working-directory: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pytest -q tests/test_architecture.py tests/test_blocked_assessment.py tests/test_closure_security.py tests/test_closure_traceability.py tests/test_dependency_lock.py tests/test_engineering_foundation.py tests/test_hosted_branch_protection.py tests/test_m1_completion.py tests/test_replay.py tests/test_stage0b_phase39.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit --local
