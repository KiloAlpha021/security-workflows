name: NON-AUTHORITATIVE F7-R3B dirty-state attribution

on:
  push:
    branches:
      - diagnostic-f7-r3b-dirty-attribution-20261007

permissions:
  contents: read

jobs:
  diagnostic-only:
    name: DIAGNOSTIC ONLY - not maintenance certification
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen V2 witness for sequence equivalence only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-workflows
          ref: 11b5d70a324977be5bb5f1019d90949c05039dd3
          path: witness
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact protected policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: c047a203fc7e1e3326e044f128a7323dea60041b
          path: protected
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact frozen PR22 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: a93b8293491e5502d420f2b99b4b7222c815f7ad
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Restore representations exactly as failed preflight then observe and refresh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C witness -c core.autocrlf=false -c core.eol=lf checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C protected -c core.autocrlf=false -c core.eol=lf checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C candidate -c core.autocrlf=false -c core.eol=lf checkout-index --all --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'f7-r3b-readonly-attribution.py'
          $diagnosticSource = @'
          """NON-AUTHORITATIVE observation only; no policy or certification result."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          
          
          def command(root, *args):
              result = subprocess.run(["git", "-C", str(root), *args], capture_output=True)
              return {"command": ["git", "-C", root.name, *args],
                      "exit": result.returncode,
                      "stdout": result.stdout.decode("utf-8", errors="strict") or "<EMPTY>",
                      "stderr": result.stderr.decode("utf-8", errors="strict") or "<EMPTY>"}
          
          
          def text(result):
              return "" if result["stdout"] == "<EMPTY>" else result["stdout"]
          
          
          def index_digest(root):
              result = command(root, "rev-parse", "--git-path", "index")
              path = Path(text(result).strip())
              if not path.is_absolute():
                  path = root / path
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          
          def tracked_bytes(root):
              result = subprocess.run(["git", "-C", str(root), "ls-files", "-z"],
                                      capture_output=True, check=True)
              return {name.decode(): hashlib.sha256((root / name.decode()).read_bytes()).hexdigest()
                      if (root / name.decode()).is_file() else "<MISSING>"
                      for name in result.stdout.split(b"\0") if name}
          
          
          BEFORE_COMMANDS = {
              "A_porcelain_v2": ("status", "--porcelain=v2", "--untracked-files=all"),
              "B_short": ("status", "--short", "--untracked-files=all"),
              "C_diff_name_status": ("diff", "--name-status"),
              "D_cached_diff_name_status": ("diff", "--cached", "--name-status"),
              "E_diff_raw": ("diff", "--raw"),
              "F_cached_diff_raw": ("diff", "--cached", "--raw"),
              "G_index_stage": ("ls-files", "--stage"),
              "H_index_debug": ("ls-files", "--debug"),
              "I_core_config": ("config", "--show-origin", "--get-regexp",
                                r"^core\.(autocrlf|eol|filemode|safecrlf)$"),
          }
          
          
          def dirty_paths(root, before):
              records = []
              for line in text(before["A_porcelain_v2"]).splitlines():
                  if line.startswith("1 "):
                      fields = line.split(" ", 8)
                      path, xy = fields[8], fields[1]
                      modes = {"head": fields[3], "index": fields[4], "worktree": fields[5]}
                  elif line.startswith("? "):
                      path, xy = line[2:], "??"
                      modes = {"head": None, "index": None, "worktree": None}
                  else:
                      records.append({"repository": root.name, "porcelain_v2_record": line,
                                      "classification": "OTHER_EXACTLY_DESCRIBED_STATE",
                                      "detail": "Non-ordinary status record retained verbatim; no identity guessed"})
                      continue
                  head = command(root, "rev-parse", "HEAD:" + path)
                  entry = command(root, "ls-files", "--stage", "--", path)
                  hashed = command(root, "hash-object", "--", path)
                  raw_hash = command(root, "hash-object", "--no-filters", "--", path)
                  attributes = command(root, "check-attr", "--all", "--", path)
                  head_oid = text(head).strip() if head["exit"] == 0 else None
                  stage = text(entry).strip()
                  index_oid = stage.split()[1] if stage else None
                  worktree_oid = text(hashed).strip() if hashed["exit"] == 0 else None
                  file = root / path
                  if xy == "??":
                      relation = "UNTRACKED"
                  elif not file.exists():
                      relation = "DELETED"
                  elif index_oid != head_oid:
                      relation = "INDEX_DIFFERS_FROM_HEAD"
                  elif worktree_oid != index_oid:
                      relation = "WORKTREE_DIFFERS_FROM_INDEX"
                  elif modes["head"] != modes["index"] or modes["index"] != modes["worktree"]:
                      relation = "MODE_ONLY_DIFFERENCE"
                  else:
                      relation = "CONTENT_EQUAL_HEAD"
                  records.append({"repository": root.name, "path": path,
                                  "porcelain_v2_record": line,
                                  "short_status": next((s for s in text(before["B_short"]).splitlines()
                                                        if s[3:] == path), "<NOT_PRESENT_IN_SHORT_OUTPUT>"),
                                  "head_blob_oid": head_oid, "index_blob_oid": index_oid,
                                  "worktree_hash": worktree_oid, "worktree_raw_hash": text(raw_hash).strip(),
                                  "index_entry": stage or "<NO_INDEX_ENTRY>", "git_modes": modes,
                                  "filesystem_mode": oct(stat.S_IMODE(file.lstat().st_mode)) if file.exists() else None,
                                  "attributes": attributes, "content_relation": relation,
                                  "head_command": head, "index_command": entry,
                                  "hash_command": hashed, "raw_hash_command": raw_hash})
              return records
          
          
          report = {"authority": "NONE: DIAGNOSTIC ONLY; NOT MAINTENANCE CERTIFICATION",
                    "platform": os.name, "git_version": command(Path.cwd(), "--version"),
                    "inherited_git_environment": {key: os.environ.get(key, "<ABSENT>") for key in
                        ("GIT_CONFIG_COUNT", "GIT_CONFIG_KEY_0", "GIT_CONFIG_VALUE_0", "GIT_OPTIONAL_LOCKS")},
                    "repositories": {}}
          roots = {name: (Path.cwd() / name).resolve(strict=True) for name in ("protected", "candidate")}
          expected = {
              "protected": ("c047a203fc7e1e3326e044f128a7323dea60041b", "c49bebd5d6106da224da733d30b4c2d97c430bfc"),
              "candidate": ("a93b8293491e5502d420f2b99b4b7222c815f7ad", "ce45c73908adc77cbaa2151cf2b724ded6ff87bc"),
          }
          snapshots = {}
          for name, root in roots.items():
              assert text(command(root, "rev-parse", "HEAD")).strip() == expected[name][0]
              assert text(command(root, "rev-parse", "HEAD^{tree}")).strip() == expected[name][1]
              snapshots[name] = tracked_bytes(root)
              item = {"head": command(root, "rev-parse", "HEAD"),
                      "tree": command(root, "rev-parse", "HEAD^{tree}"),
                      "initial_index_entries": command(root, "ls-files", "--stage"),
                      "index_digest_before_observation": index_digest(root), "before": {}}
              for label, args in BEFORE_COMMANDS.items():
                  item["before"][label] = command(root, *args)
                  item["before"][label]["index_digest_after_command"] = index_digest(root)
              item["dirty_paths"] = dirty_paths(root, item["before"])
              item["last_status_before_refresh"] = command(root, "status", "--porcelain=v2", "--untracked-files=all")
              item["index_digest_immediately_before_refresh"] = index_digest(root)
              report["repositories"][name] = item
          print("DIAGNOSTIC_BEFORE_JSON=" + json.dumps(report, sort_keys=True), flush=True)
          
          for name, root in roots.items():
              item = report["repositories"][name]
              item["refresh"] = command(root, "update-index", "--refresh")
              item["index_digest_immediately_after_refresh"] = index_digest(root)
              item["after_refresh"] = {label: command(root, *args)
                                       for label, args in list(BEFORE_COMMANDS.items())[:4]}
              item["index_stage_after"] = command(root, "ls-files", "--stage")
              item["index_debug_after"] = command(root, "ls-files", "--debug")
              item["tracked_content_unchanged"] = snapshots[name] == tracked_bytes(root)
              item["index_entries_unchanged"] = text(item["initial_index_entries"]) == text(item["index_stage_after"])
              initial = text(item["before"]["A_porcelain_v2"])
              immediate = text(item["last_status_before_refresh"])
              after = text(item["after_refresh"]["A_porcelain_v2"])
              item["refresh_effect"] = ("BEFORE_CLEAN_NOT_REPRODUCED" if not initial else
                                        "CLEANED_DURING_OBSERVATION_NOT_ATTRIBUTABLE_TO_REFRESH" if not immediate else
                                        "DIRTY_TO_CLEAN" if not after else "NO_CHANGE")
          print("DIAGNOSTIC_FINAL_JSON=" + json.dumps(report, sort_keys=True), flush=True)
          print("NON_AUTHORITATIVE_DIAGNOSTIC_COMPLETE; NO_CERTIFICATION_RESULT", flush=True)
          '@
          [IO.File]::WriteAllText($diagnosticPath, $diagnosticSource, [Text.UTF8Encoding]::new($false))
          python -I -S $diagnosticPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
