name: security-policy-maintenance-pr31

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  successor-proposal-qualification:
    if: github.repository == 'KiloAlpha021/security-workflows'
    name: successor-proposal-qualification
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out successor proposal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-workflows
          ref: ${{ github.event.pull_request.head.sha }}
          path: witness
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact protected policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: f36ed0b258a0581903698cc2cfac923ded19bd30
          path: protected
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact PR31 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: 852b1e80e4dc86517f6023aad9d78c87d99b95c2
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out current PR31 synthetic merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: refs/pull/31/merge
          path: evaluation
          persist-credentials: false
          fetch-depth: 0
      - name: Check out frozen historical witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-workflows
          ref: 8b35cf9f83b32c6bd8ee4fdd824bee1a57aaa94a
          path: historical-witness
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Restore canonical representations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @('witness', 'protected', 'candidate', 'evaluation')) {
            git -C $root -c core.autocrlf=false -c core.eol=lf checkout-index --index --all --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run successor positive and negative tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          python -I -B witness/maintenance_pr31/test_witness.py --base protected --head candidate --merge evaluation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -c "from pathlib import Path; [compile(p.read_bytes(), str(p), 'exec') for p in Path('witness/maintenance_pr31').glob('*.py')]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify historical witness preservation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $historicalHead = git -C historical-witness rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $historicalHead -ne '8b35cf9f83b32c6bd8ee4fdd824bee1a57aaa94a') { throw 'Historical witness commit substitution' }
          $historicalWorkflow = git -C historical-witness rev-parse 'HEAD:.github/workflows/security-policy-maintenance.yml'
          if ($LASTEXITCODE -ne 0 -or $historicalWorkflow -ne 'ccfeb9c2962235355bc7258580bce46a2419d5de') { throw 'Historical workflow substitution' }
          $historicalImplementation = git -C historical-witness rev-parse 'HEAD:maintenance/witness.py'
          if ($LASTEXITCODE -ne 0 -or $historicalImplementation -ne '4fdcec2d94118ee6165c548097a85beecb4aad4e') { throw 'Historical implementation substitution' }

  independent-maintenance-pr31:
    if: github.repository == 'KiloAlpha021/security-policy'
    name: independent-security-policy-maintenance-pr31
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out independent protected witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-workflows
          ref: ${{ github.workflow_sha }}
          path: witness
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact protected policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: f36ed0b258a0581903698cc2cfac923ded19bd30
          path: protected
          persist-credentials: false
          fetch-depth: 0
      - name: Check out exact PR31 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: 852b1e80e4dc86517f6023aad9d78c87d99b95c2
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Check out event-selected PR31 synthetic merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KiloAlpha021/security-policy
          ref: ${{ github.sha }}
          path: evaluation
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
      - name: Verify exact successor binding
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($root in @('witness', 'protected', 'candidate', 'evaluation')) {
            git -C $root -c core.autocrlf=false -c core.eol=lf checkout-index --index --all --force
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -I -S -B witness/maintenance_pr31/witness.py protected candidate evaluation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install independently pinned policy environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv policy-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r protected/requirements-policy.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run successor witness tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -I -B witness/maintenance_pr31/test_witness.py --base protected --head candidate --merge evaluation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run admitted policy compatibility suites
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          .\policy-env\Scripts\python.exe -m unittest discover -s candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy-env\Scripts\python.exe -m unittest discover -s protected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit independently pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv audit-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r candidate/requirements-audit.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\audit-env\Scripts\python.exe -m pip_audit --no-deps -r protected/requirements-policy.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
